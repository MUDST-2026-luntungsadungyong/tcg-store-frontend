name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  merge_group:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Linting (Typecheck & Oxlint)
        run: npm run lint

      - name: Run Security & Dependency Audit (npm audit)
        run: npm run audit

      - name: Run Unit and Component Tests
        run: npm run test

      - name: Build Project
        run: npm run build

  docker-build-verify:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (dry-run test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: tcg-store-frontend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: Security & Secret Scan (Gitleaks & Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Run Trivy Vulnerability Scanner (Filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
  e2e-test:
    name: Cypress E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Start Vite and wait for HTTP readiness
        env:
          VITE_ENABLE_MOCK_API: 'true'
          VITE_PORT: '3000'
        run: |
          npm run dev -- --host localhost --port 3000 --strictPort > /tmp/vite-e2e.log 2>&1 &
          vite_pid=$!
          for attempt in {1..60}; do
            if curl --fail --silent --output /dev/null http://localhost:3000; then
              cat /tmp/vite-e2e.log
              exit 0
            fi
            if ! kill -0 "$vite_pid" 2>/dev/null; then
              cat /tmp/vite-e2e.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/vite-e2e.log
          echo 'Vite did not become ready within 120 seconds'
          exit 1

      - name: Run Cypress E2E tests
        uses: cypress-io/github-action@v6
        env:
          VITE_ENABLE_MOCK_API: 'true'
          VITE_PORT: '3000'
        with:
          install: false
