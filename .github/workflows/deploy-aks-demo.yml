name: Deploy frontend to AKS demo

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: aks-demo-frontend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      ACR_NAME: tcgstorecimah2026
      ACR_LOGIN_SERVER: tcgstorecimah2026.azurecr.io
      AKS_RESOURCE_GROUP: rg-tcg-store-aks-demo
      AKS_CLUSTER: aks-tcg-store-demo
      KUBE_NAMESPACE: tcg-store-aks-demo
      PUBLIC_URL: https://tcgstore-demo-2026-11.malaysiawest.cloudapp.azure.com

    steps:
      - name: Checkout the verified main commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build and push frontend image to ACR
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile.aks
          platforms: linux/amd64
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/tcg-store-frontend:sha-${{ env.SOURCE_SHA }}
          build-args: VITE_API_BASE_URL=/api
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install kubectl and get AKS credentials
        shell: bash
        run: |
          set -euo pipefail
          az aks install-cli --install-location "$RUNNER_TEMP/kubectl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          az aks get-credentials --resource-group "$AKS_RESOURCE_GROUP" \
            --name "$AKS_CLUSTER" --admin --file "$RUNNER_TEMP/kubeconfig" \
            --overwrite-existing
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Pin image digest and deploy frontend
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          manifest=infra/kubernetes/aks-demo/kustomization.yaml
          sed -i -E "s|^    digest: sha256:[0-9a-f]{64}$|    digest: ${IMAGE_DIGEST}|" "$manifest"
          test "$(grep -Fxc "    digest: ${IMAGE_DIGEST}" "$manifest")" -eq 1
          kubectl apply --dry-run=server -k infra/kubernetes/aks-demo
          kubectl apply -k infra/kubernetes/aks-demo
          kubectl rollout status -n "$KUBE_NAMESPACE" \
            deployment/tcg-store-frontend --timeout=5m

      - name: Verify public HTTPS frontend and API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-delay 5 \
            "$PUBLIC_URL/" -o "$RUNNER_TEMP/frontend.html"
          grep -Fq '<div id="root"' "$RUNNER_TEMP/frontend.html"
          curl --fail --silent --show-error --retry 10 --retry-delay 5 \
            "$PUBLIC_URL/api/health" | jq -e '.status == "UP" and .database == "Connected"'
          kubectl get deployment,pods,service -n "$KUBE_NAMESPACE" -o wide
