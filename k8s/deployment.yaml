apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcg-frontend-deployment
  labels:
    app: tcg-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tcg-frontend
  template:
    metadata:
      labels:
        app: tcg-frontend
    spec:
      containers:
        - name: tcg-frontend
          image: tcg-store-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
